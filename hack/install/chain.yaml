apiVersion: apps/v1
kind: Deployment
metadata:
  name: wetee-dev
  namespace: worker-addon
spec:
  selector:
    matchLabels:
      app: wetee-dev
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: wetee-dev
    spec:
      containers:
        - image: registry.cn-hangzhou.aliyuncs.com/wetee_dao/wetee-node:dev.2024-11-16-21_32
          name: c1
          volumeMounts:
            - name: wetee-chain
              mountPath: /chain-data
        - name: c2
          command:
            - /bin/sh
            - "-c"
            - 'nginx -g "daemon off;" -c  /mnt/ssl-proxy/nginx.conf'
          image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
          ports:
            - containerPort: 443
              name: wetee-dev-443
              protocol: TCP
          volumeMounts:
            - name: wetee-proxy
              mountPath: /mnt/ssl-proxy
        - sidecar:
          name: sidecar
          image: registry.cn-hangzhou.aliyuncs.com/wetee_dao/substrate_sidecar:2024-11-26-15_26
          env:
            - name: SAS_EXPRESS_KEEP_ALIVE_TIMEOUT
              value: 6000
      volumes:
        - name: wetee-chain
          hostPath:
            type: DirectoryOrCreate
            path: /mnt/chain-dev/
        - name: wetee-proxy
          hostPath:
            type: DirectoryOrCreate
            path: /mnt/ssl-proxy
      nodeSelector:
        TEE: "SGX"
